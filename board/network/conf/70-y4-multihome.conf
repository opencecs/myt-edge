# No bridging, NAT or forwarding is enabled by this package.
# Exact interface keys; standard udev/systemd-sysctl applies these when created.
-net.ipv4.conf.y4lan.arp_ignore = 1
-net.ipv4.conf.y4lan.arp_announce = 2
-net.ipv4.conf.y4lan.rp_filter = 2
-net.ipv4.conf.bond10g.arp_ignore = 1
-net.ipv4.conf.bond10g.arp_announce = 2
-net.ipv4.conf.bond10g.rp_filter = 2
