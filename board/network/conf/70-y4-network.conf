# Native NetworkManager owns DHCP, routes and resolver configuration.
[main]
no-auto-default=y4lan,y4sfp1,y4sfp2
# Preserve NetworkManager's native DNS/resolver auto selection. In the frozen
# base neither resolved nor resolvconf is installed, so NM itself updates the
# regular resolver file from DHCP. Existing administrator resolver owners remain.

[device-y4-bond]
match-device=interface-name:bond10g
ignore-carrier=false
