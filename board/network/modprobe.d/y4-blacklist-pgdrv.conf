# The Realtek PG factory driver carries PCI device aliases (10ec:8125/8127
# and legacy Realtek IDs). Left to udev coldplug it is loaded at every boot,
# and the NIC factory requires a clean module state before it may load the
# module itself under its own lock, so every boot failed with EBUSY. The
# factory loads the module with finit_module; administrators can still
# modprobe it explicitly.
blacklist pgdrv
